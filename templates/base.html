<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahumuza John Baptist | Software Developer & Entrepreneur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .text-accent { color: #ccff00; }
        .bg-accent { background-color: #ccff00; }
        .border-accent { border-color: #ccff00; }
        .hover\:bg-accent:hover { background-color: #b8e600; }
    </style>
</head>
<body class="bg-black text-white antialiased">

    <!-- Navigation -->
    <nav class="border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold">
                <img src="{{ url_for('static', filename='images/gallery/logo.jpg') }}" alt="JBRO" class="h-10 w-auto">
            </a>
            
            <div class="hidden md:flex items-center space-x-8">
                <a href="#home" class="text-sm text-gray-400 hover:text-white transition">HOME</a>
                <a href="#about" class="text-sm text-gray-400 hover:text-white transition">ABOUT</a>
                <a href="#work" class="text-sm text-gray-400 hover:text-white transition">WORK</a>
                <a href="#contact" class="text-sm text-gray-400 hover:text-white transition">CONTACT</a>
            </div>
            
            <a href="#contact" class="hidden md:block px-5 py-2.5 bg-accent text-black text-sm font-semibold rounded hover:bg-accent/90 transition">
                Let's Talk
            </a>
            
            <!-- Mobile menu button -->
            <button id="mobile-menu-btn" class="md:hidden text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>
        
        <!-- Mobile menu -->
        <div id="mobile-menu" class="hidden md:hidden border-t border-gray-800 bg-black">
            <div class="px-6 py-4 space-y-3">
                <a href="#home" class="block text-sm text-gray-400 hover:text-white">HOME</a>
                <a href="#about" class="block text-sm text-gray-400 hover:text-white">ABOUT</a>
                <a href="#work" class="block text-sm text-gray-400 hover:text-white">WORK</a>
                <a href="#contact" class="block text-sm text-gray-400 hover:text-white">CONTACT</a>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-800 mt-20">
        <div class="max-w-7xl mx-auto px-6 py-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <p class="text-sm text-gray-500">© 2026 Ahumuza John Baptist</p>
            <div class="flex space-x-6">
                <a href="https://github.com/ahumuzaJohnbaptist5" target="_blank" class="text-sm text-gray-500 hover:text-white">GitHub</a>
                <a href="https://linkedin.com/in/yourprofile" target="_blank" class="text-sm text-gray-500 hover:text-white">LinkedIn</a>
                <a href="mailto:your.email@example.com" class="text-sm text-gray-500 hover:text-white">Email</a>
            </div>
        </div>
    </footer>

    <script>
        const mobileBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        if (mobileBtn) {
            mobileBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });
        }
    </script>

</body>
</html>
